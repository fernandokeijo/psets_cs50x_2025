{% extends "layout.html" %}

{% block main %}

<link href="/static/style.css" rel="stylesheet">


<div class="container my-4">
    <h3 class="mb-4">Latest Posts</h3>

    <div class="timeline">

        {% for review in reviews %}
        <a href="/review/{{ review.id }}" class="post-card-link">

<div class="timeline-card">

    <div class="timeline-header">
        <img src="{{ url_for(
            'static',
            filename='uploads/' + (review.profile_picture or 'default_pfp.png')
            ) }}"
             class="timeline-pfp">

        <span class="timeline-user">@{{ review.username }}</span>
    </div>

    <h5 class="timeline-title">{{ review.title }}</h5>

    {% if review.main_image %}
    <img src="{{ url_for('static', filename='uploads/' + review.main_image) }}"
         class="timeline-image">
    {% endif %}

    <div class="timeline-stats">
        ❤️ {{ review.likes_count or 0 }}
        💬 {{ review.comments_count or 0 }}
        ⭐ {{ review.avg_rating or "—" }}
    </div>

</div>
</a>

        {% endfor %}

    </div>
</div>


{% endblock %}
