{% extends "layout.html" %}

{% block title %}
    rate
{% endblock %}

{% block main %}

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="card p-4 mx-auto" style="max-width: 700px;">
<h2 class="mb-4 text-center">Rate a Bathroom</h2>


<form action="/rate" method="post" enctype="multipart/form-data">


<!-- Title -->
<div class="mb-3">
<label class="form-label">Title</label>
<input type="text" name="title" class="form-control" placeholder="Enter a short title" required>
</div>


<!-- Description -->
<div class="mb-3">
<label class="form-label">Description</label>
<textarea name="description" class="form-control" rows="4" placeholder="Describe your experience" required></textarea>
</div>


<!-- Image Upload -->
<div class="mb-3">
<label class="form-label">Upload up to 3 images</label>
<input class="form-control" type="file" name="images" accept="image/*" multiple>
<small class="text-secondary">Max 3 images</small>
</div>


<!-- Star Rating -->
<div class="mb-3 text-center">
<label class="form-label">Rating</label>


<div class="star-rating mt-2">
<input type="radio" id="star5" name="rating" value="5" required><label for="star5">★</label>
<input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
<input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
<input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
<input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
</div>
</div>


<!-- Submit Button -->
<div class="text-center mt-4">
<button type="submit"
        class="btn btn-primary px-4"
        onclick="this.disabled=true; this.form.submit();">
    Submit Rating
</button>
</div>


</form>
</div>

{% endblock %}
