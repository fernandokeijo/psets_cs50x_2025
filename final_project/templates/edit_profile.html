{% extends "layout.html" %}
{% block main %}

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="card p-4 mx-auto" style="max-width: 500px;">

    <h3 class="page-title">Edit Profile</h3>

    <form action="/profile/edit" method="post" enctype="multipart/form-data">

        <!-- Profile picture -->
        <div class="text-center mb-3">
            <img src="{{ url_for(
            'static',
            filename='uploads/' + (user.profile_picture or 'default_pfp.png')
            ) }}"
            class="profile-pfp mb-2">

            <input type="file" name="photo" class="form-control mt-2">
        </div>

        <!-- Username -->
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text"
                   name="username"
                   class="form-control"
                   value="{{ user.username }}"
                   required>
        </div>

        <!-- Save -->
        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-primary">
                Save changes
            </button>

            <button type="button"
                    class="btn btn-outline-danger"
                    onclick="confirmDelete()">
                Delete account
            </button>
        </div>
    </form>
</div>

<script>
function confirmDelete() {
    if (confirm("This will permanently delete your account. Are you sure?")) {
        fetch("/profile/delete", { method: "POST" })
            .then(() => window.location.href = "/logout");
    }
}
</script>

{% endblock %}
